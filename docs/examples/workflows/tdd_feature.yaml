name: tdd_feature
description: TDD pipeline — spec → tests written first → execute to green → review.

stages:
  - id: spec
    skill: spec_writer
    inputs:
      - "$ARGUMENTS"

  - id: tests
    skill: test_writer
    depends_on: [spec]
    inputs:
      - "Write failing tests for this spec BEFORE any implementation exists.\nSpec:\n{spec.output}"

  - id: execute
    skill: executor
    depends_on: [tests]
    inputs:
      - "Spec:\n{spec.output}\n\nTests already written by test_writer:\n{tests.output}\n\nYour job: implement the minimum code to make these tests pass. Do NOT modify the tests."

  - id: verify_tests
    skill: test_runner
    depends_on: [execute]
    inputs:
      - "Run the tests written for this spec. Spec:\n{spec.output}\n\nTests:\n{tests.output}"
    loop_until_marker: "## TESTS PASSED"
    on_marker:
      "## TESTS FAILED": "redo:execute"
      "## TESTS FLAKY": "fail"
    max_attempts: 3

  # review runs in PARALLEL with verify_tests — both depend only on execute,
  # not on each other. reviewer reads code directly via tools; it does not
  # need the test verdict. If verify_tests emits redo:execute, the new
  # workflow runner resets review along with execute (transitive descendants),
  # so a re-executed code will get re-reviewed automatically.
  - id: review
    skill: code_reviewer
    depends_on: [execute]
    inputs:
      - "Spec:\n{spec.output}\n\nTests:\n{tests.output}\n\nExecutor summary:\n{execute.output}"
