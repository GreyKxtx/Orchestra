[package]
name = "orchestra-desktop"
version = "0.1.0"
description = "Orchestra desktop shell"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "orchestra_desktop"
path = "src/lib.rs"

[[bin]]
name = "orchestra-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: Window::add_child, which puts the browser panel inside the main
# window as a view of the app rather than a second window. devtools: the
# panel's F12, which a debug build has anyway and a release build must ask for.
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The browser panel's menu. WebView2 has no API of its own for a screenshot,
# a reload that ignores the cache, or clearing a site's data: they are
# devtools-protocol calls, and this is the interface for them. winreg reads
# the key Windows registers every installed browser under.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"
winreg = "0.55"

[profile.release]
strip = true
lto = true
codegen-units = 1
