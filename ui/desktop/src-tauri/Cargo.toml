[package]
name = "orchestra-desktop"
version = "0.1.0"
description = "Orchestra desktop shell"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "orchestra_desktop"
path = "src/lib.rs"

[[bin]]
name = "orchestra-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
