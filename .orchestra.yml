project_root: D:\CursorProjects\Orchestra
exclude_dirs:
    - .git
    - node_modules
    - dist
    - build
    - .orchestra
context_limit_kb: 64
llm:
    api_base: http://10.5.0.2:1234
    api_key: "lm-studio"
    model: openai/gpt-oss-20b
    max_tokens: 8192
    temperature: 0.2
    timeout_s: 180
    extra_body:
        num_ctx: 20000
providers:
    fast:
        api_base: http://10.5.0.2:1234
        api_key: "lm-studio"
        model: nvidia/nemotron-3-nano-4b
        max_tokens: 4096
        temperature: 0.2
        timeout_s: 90
        extra_body:
            num_ctx: 20000
embed:
    api_base: http://10.5.0.2:1234/v1
    api_key: "lm-studio"
    model: text-embedding-nomic-embed-text-v1.5
    batch_size: 16
    timeout_s: 60
lsp:
    servers:
        - language: go
          extensions: [".go"]
          command: ["gopls", "serve"]
    diagnostics_timeout_ms: 5000
