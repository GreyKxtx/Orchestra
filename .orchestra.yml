project_root: .
exclude_dirs:
    - .git
    - node_modules
    - dist
    - build
    - .orchestra
context_limit_kb: 64
llm:
    api_base: http://localhost:1234/v1
    api_key: ""
    model: qwen2.5-coder-7b-instruct
    max_tokens: 8192
    temperature: 0.2
    timeout_s: 180
    multimodal: true
    extra_body:
        num_ctx: 32768
lsp:
    servers:
        - language: go
          extensions: [".go"]
          command: ["gopls", "serve"]
    diagnostics_timeout_ms: 5000
    auto_install: ask
