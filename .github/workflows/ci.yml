name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Unit tests must not download language servers: each test workspace
      # with a .go or .yml file started go install / npm install in the
      # shared ~/.orchestra/lsp, in parallel, and timed tests failed under
      # that load. Tests that read gopls's answers skip without it.
      ORCHESTRA_LSP_AUTO_INSTALL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go work sync

      - name: Vet
        run: go vet ./... ./protocol/... ./patch/... ./llm/...

      - name: Test (coverage)
        run: go test -coverprofile=coverage.out ./... ./protocol/... ./patch/... ./llm/...

      # A floor, not a target: it catches a change that lands a package of
      # untested code, and moves up by hand as coverage does. Measured with
      # ORCHESTRA_LSP_AUTO_INSTALL=false, as above — tests that need gopls
      # skip here, so the number is lower than on a laptop that has it.
      - name: Coverage floor
        env:
          COVERAGE_FLOOR: "58"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "Go statement coverage: ${total}% (floor ${COVERAGE_FLOOR}%)" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" -v min="$COVERAGE_FLOOR" 'BEGIN { exit !(t + 0 >= min + 0) }' \
            || { echo "::error::coverage ${total}% is below the ${COVERAGE_FLOOR}% floor"; exit 1; }

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

      - name: Import rules
        run: go test ./tests/importrules/... -count=1

      - name: Test (race)
        run: go test -race ./... ./protocol/... ./patch/... ./llm/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go work sync

      # One pass brought the whole tree in line (listed in
      # .git-blame-ignore-revs); this keeps it there.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -w these files:"
            echo "$unformatted"
            exit 1
          fi

      # Linters and exclusions: .golangci.yml.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          args: ./... ./llm/... ./patch/... ./protocol/...

  # Known vulnerabilities in the code paths the binary actually reaches, in
  # dependencies and in the Go standard library it is built with.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go work sync

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./... ./llm/... ./patch/... ./protocol/...

  test-windows:
    runs-on: windows-latest
    env:
      # Unit tests must not download language servers: each test workspace
      # with a .go or .yml file started go install / npm install in the
      # shared ~/.orchestra/lsp, in parallel, and timed tests failed under
      # that load. Tests that read gopls's answers skip without it.
      ORCHESTRA_LSP_AUTO_INSTALL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Add MinGW to PATH (required for CGO and race detector)
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download modules
        run: go work sync

      - name: Vet
        run: go vet ./... ./protocol/... ./patch/... ./llm/...

      - name: Test (Windows)
        run: go test ./... ./protocol/... ./patch/... ./llm/...

      - name: Import rules
        run: go test ./tests/importrules/... -count=1

      - name: Test (Windows, race)
        run: go test -race ./... ./protocol/... ./patch/... ./llm/...

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/vscode/package-lock.json

      - name: Install dependencies
        working-directory: ui/vscode
        run: npm ci

      - name: Compile TypeScript
        working-directory: ui/vscode
        run: npm run compile

      # media/chat-src sits outside tsconfig's include, so nothing above covers
      # it. These checks are what make edits there verifiable: the bundles parse
      # and are current, the pure helpers return what they claim, and no
      # fragment reaches past the `host` seam back to the VS Code API.
      - name: Webview checks
        working-directory: ui/vscode
        run: npm run check:webview

      # The extension's own unit tests — framing, turn projection, markdown,
      # stream sanitising, the memory notice, skill commands, core-binary
      # resolution, the MCP registry. They were written, compiled by the step
      # above, and then discarded: nothing ran them here or in the workflow
      # that publishes the VSIX, so the extension shipped with its test suite
      # green only on whoever's laptop last remembered to run it.
      - name: Extension unit tests
        working-directory: ui/vscode
        run: npm test

      # No npm dependencies — plain node, run from the repo root.
      - name: Web UI checks
        run: node ui/web/scripts/check-web.mjs

      - name: Web UI adapter tests
        run: node ui/web/scripts/adapter-test.mjs

      - name: Browser picker tests
        run: node ui/desktop/scripts/picker-test.mjs
      - name: Devtools painter tests
        run: node ui/desktop/scripts/paint-test.mjs

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui/desktop/src-tauri
    steps:
      - uses: actions/checkout@v6

      # Tauri's Linux prerequisites (WebKitGTK 4.1 and friends).
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/desktop/src-tauri -> target

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build
