name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go work sync

      - name: Vet
        run: go vet ./... ./protocol/... ./patch/... ./llm/...

      - name: Test
        run: go test ./... ./protocol/... ./patch/... ./llm/...

      - name: Import rules
        run: go test ./tests/importrules/... -count=1

      - name: Test (race)
        run: go test -race ./... ./protocol/... ./patch/... ./llm/...

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Add MinGW to PATH (required for CGO and race detector)
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download modules
        run: go work sync

      - name: Vet
        run: go vet ./... ./protocol/... ./patch/... ./llm/...

      - name: Test (Windows)
        run: go test ./... ./protocol/... ./patch/... ./llm/...

      - name: Import rules
        run: go test ./tests/importrules/... -count=1

      - name: Test (Windows, race)
        run: go test -race ./... ./protocol/... ./patch/... ./llm/...

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/vscode/package-lock.json

      - name: Install dependencies
        working-directory: ui/vscode
        run: npm ci

      - name: Compile TypeScript
        working-directory: ui/vscode
        run: npm run compile
