name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go work sync

      - name: Vet
        run: go vet ./... ./protocol/... ./patch/... ./llm/...

      - name: Test
        run: go test ./... ./protocol/... ./patch/... ./llm/...

      - name: Import rules
        run: go test ./tests/importrules/... -count=1

      - name: Test (race)
        run: go test -race ./... ./protocol/... ./patch/... ./llm/...

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Add MinGW to PATH (required for CGO and race detector)
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download modules
        run: go work sync

      - name: Vet
        run: go vet ./... ./protocol/... ./patch/... ./llm/...

      - name: Test (Windows)
        run: go test ./... ./protocol/... ./patch/... ./llm/...

      - name: Import rules
        run: go test ./tests/importrules/... -count=1

      - name: Test (Windows, race)
        run: go test -race ./... ./protocol/... ./patch/... ./llm/...

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/vscode/package-lock.json

      - name: Install dependencies
        working-directory: ui/vscode
        run: npm ci

      - name: Compile TypeScript
        working-directory: ui/vscode
        run: npm run compile

      # media/chat-src sits outside tsconfig's include, so nothing above covers
      # it. These checks are what make edits there verifiable: the bundles parse
      # and are current, the pure helpers return what they claim, and no
      # fragment reaches past the `host` seam back to the VS Code API.
      - name: Webview checks
        working-directory: ui/vscode
        run: npm run check:webview

      # No npm dependencies — plain node, run from the repo root.
      - name: Web UI checks
        run: node ui/web/scripts/check-web.mjs

      - name: Web UI adapter tests
        run: node ui/web/scripts/adapter-test.mjs

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui/desktop/src-tauri
    steps:
      - uses: actions/checkout@v6

      # Tauri's Linux prerequisites (WebKitGTK 4.1 and friends).
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/desktop/src-tauri -> target

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build
