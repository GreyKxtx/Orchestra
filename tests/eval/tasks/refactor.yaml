name: refactor
description: Extract duplicated logic into a helper function
max_steps: 16
files:
  go.mod: |
    module testpkg
    go 1.21
  util.go: |
    package testpkg

    func ClampPositive(n int) int {
        if n < 0 {
            return 0
        }
        return n
    }

    func ClampPositiveFloat(f float64) float64 {
        if f < 0 {
            return 0
        }
        return f
    }
query: "Refactor util.go: extract shared clamp-to-zero logic into a private helper and use it from both exported functions."
checks:
  - type: file_contains
    path: util.go
    content: "func ClampPositive("
  - type: file_contains
    path: util.go
    content: "func ClampPositiveFloat("
  - type: file_contains
    path: util.go
    content: "clamp"
