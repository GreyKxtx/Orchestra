# The one task whose fixture is long enough to matter: over 300 lines, past
# the point where read answers a .go file with its symbol list instead of its
# text. It is also the task that regressed hardest when tool-schema parameter
# descriptions were dropped — 3/3 to 0/3 — each failure the model searching
# for text it had already replaced.
#
# The checks that carry it are the ones about what did NOT change: a model
# that rewrites the file wholesale can get MaxRetries right and still destroy
# the work. file_matches on the last function is the cheapest proof the tail
# survived.
name: edit_in_large_file
description: Change one constant in a 300-line file without rewriting it
max_steps: 12
